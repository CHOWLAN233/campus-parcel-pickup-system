name: Bug report
description: 记录可复现的缺陷
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: reporter
    attributes:
      label: Reporter GitHub username or public role label
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, branch/commit and test account
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and suggested fix
      description: Add safe screenshots or logs; do not expose credentials or hidden seeded defects.
